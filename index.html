<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Koraconcept, colección de tableros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light only;
  --green:#1E3B34;
  --green-2:#29503F;
  --brass:#B8914B;
  --brass-deep:#8F6B2E;   /* bronce legible: cumple 4.5:1 con blanco */
  --brass-soft:#E9DCC2;
  --alu:#FFFFFF;
  --paper:#FFFFFF;
  --ink:#16201D;
  --muted:#5B6662;
  --line:rgba(22,32,29,.14);
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"Figtree", "Helvetica Neue", Arial, sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --pad:clamp(20px,4.2vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#FFFFFF;color:#16201D;forced-color-adjust:none;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:rgba(174,128,80,.22);color:#16201D}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}

/* ---------- Chrome ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);pointer-events:none;transition:color .3s ease}
.topbar > *{pointer-events:auto}
body.on-dark .topbar{color:var(--paper)}
.wordmark{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark .mark{width:38px;height:auto;display:block}
.tools{display:flex;align-items:center;gap:6px}
.tool{height:38px;min-width:38px;padding:0 12px;border-radius:19px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;transition:background-color .2s ease,transform .12s ease}
.tool:hover{background:rgba(22,32,29,.07)}
body.on-dark .tool:hover{background:rgba(255,255,255,.1)}
.tool:active{transform:scale(.96)}
.tool svg{width:18px;height:18px}
.lang{display:inline-flex;border:1px solid currentColor;border-radius:19px;height:32px;padding:2px;opacity:.9}
.lang button{padding:0 10px;border-radius:15px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body.on-dark .lang button[aria-pressed="true"]{background:var(--paper);color:var(--green)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--brass-deep);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.badge.bump{animation:bump .35s var(--ease-out)}
@keyframes bump{40%{transform:scale(1.25)}}

.bottombar{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad) 18px;pointer-events:none}
.bottombar > *{pointer-events:auto}
body.on-dark .bottombar{color:var(--paper)}
.counter{font-size:13px;font-variant-numeric:tabular-nums;opacity:.75}
.navbtns{display:flex;gap:8px}
.navbtn{width:46px;height:46px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;transition:background-color .2s ease,color .2s ease,transform .12s ease,opacity .2s}
.navbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.on-dark .navbtn:hover{background:var(--paper);color:var(--green);border-color:var(--paper)}
.navbtn:active{transform:scale(.94)}
.navbtn[disabled]{opacity:.25;pointer-events:none}
.navbtn svg{width:18px;height:18px}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--brass);z-index:41;transition:transform .5s var(--ease-io)}

/* ---------- Deck ---------- */
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;background:#FFFFFF;padding:88px var(--pad) 90px;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .45s var(--ease-out),transform .55s var(--ease-out),visibility 0s linear .55s}
.slide.before{transform:translateX(-40px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease-out),transform .55s var(--ease-out),visibility 0s}
.slide.dark{background:#FFFFFF;color:var(--ink)}
.slide.alu{background:#FFFFFF}
.inner{max-width:1320px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}

h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;line-height:1.02}
.h-xl{font-size:clamp(44px,min(6.4vw,9.4vh),104px);font-variation-settings:"opsz" 96}
.h-l{font-size:clamp(34px,4.3vw,64px);font-variation-settings:"opsz" 80}
.h-m{font-size:clamp(26px,2.6vw,38px)}
.lead{font-size:clamp(17px,1.35vw,21px);line-height:1.55;max-width:56ch;color:var(--muted)}


.btn{height:52px;padding:0 24px;border-radius:26px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;transition:background-color .2s ease,color .2s ease,transform .12s ease,border-color .2s}
.btn:active{transform:scale(.97)}
.btn-brass{background:var(--brass-deep);color:#fff}
.btn-brass:hover{background:#6F5119}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:var(--green)}
.btn-line{border:1px solid currentColor}
.btn-line:hover{background:rgba(255,255,255,.1)}
.alu .btn-line:hover,.slide:not(.dark) .btn-line:hover{background:rgba(22,32,29,.06)}

/* ---------- Cover ---------- */
.cover{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,72px);align-items:center}
.cover-meta{grid-column:1/-1;margin-top:clamp(16px,2.2vw,26px)}
.cover h1{max-width:12ch}
.cover .lead{margin-top:28px}
.cover .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.cover-brand{display:block;width:clamp(116px,10.5vw,150px);height:auto;margin-bottom:clamp(18px,2.2vw,28px)}
.contact{padding-top:16px;border-top:1px solid var(--line);font-style:normal;
  display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;line-height:1.55;color:var(--muted)}
.contact .who{color:var(--ink);font-weight:600}
.contact a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);transition:color .18s ease,border-color .18s ease}
.contact a:hover{color:var(--ink);border-color:var(--brass)}
.contact > * + *::before{content:"·";color:var(--brass-deep);margin-right:14px}
.legal{margin-top:12px;max-width:none;font-size:13px;line-height:1.55;color:var(--muted)}
.legal b{display:block;color:var(--brass-deep);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.disc-wrap{position:relative;aspect-ratio:1;width:min(100%,50vh);justify-self:center}
.disc{position:absolute;inset:6%;border-radius:50%;overflow:hidden;box-shadow:0 30px 60px -28px rgba(22,32,29,.42)}
.disc img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.32);transform-origin:50% 50%}
.disc-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.disc-ring circle{fill:none;stroke:var(--brass);stroke-width:1.2}
.disc-ring text{fill:var(--brass);font-family:var(--body);font-size:3.3px;letter-spacing:.5px}
.slide.active .disc{animation:discIn 1.1s var(--ease-out) both}
.slide.active .disc-ring .draw{stroke-dasharray:302;animation:draw 1.6s var(--ease-io) .25s both}
.slide.active .cover-text > *,
.slide.active .cover-meta{animation:rise .8s var(--ease-out) both}
.slide.active .cover-meta{animation-delay:.32s}
.slide.active .cover-text > *:nth-child(2){animation-delay:.08s}
.slide.active .cover-text > *:nth-child(3){animation-delay:.16s}
.slide.active .cover-text > *:nth-child(4){animation-delay:.24s}
@keyframes discIn{from{opacity:0;transform:scale(.92) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Intro ---------- */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,88px);align-items:center}
.intro-photo{border-radius:6px;overflow:hidden;aspect-ratio:4/3;position:relative}
.intro-photo img{width:100%;height:100%;object-fit:cover}
.intro-photo figcaption{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.93);padding:6px 12px;border-radius:14px;font-size:13px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px;border-top:1px solid var(--line);padding-top:28px}
.pillar h3{font-size:20px;letter-spacing:-.01em;margin-bottom:8px}
.pillar p{font-size:15px;color:var(--muted)}

/* ---------- Collection index ---------- */
.index{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,88px);align-items:center}
.index h2{margin-bottom:28px}
.rows{list-style:none;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.row{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto 24px;gap:20px;align-items:center;padding:18px 4px;transition:padding .25s var(--ease-out),color .2s}
.row .rn{font-family:var(--display);font-size:clamp(20px,1.8vw,27px);font-weight:500;letter-spacing:-.015em}
.row .rs{font-size:14px;color:var(--muted);text-align:right}
.row svg{width:18px;height:18px;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .25s var(--ease-out)}
.row:hover,.row.on{padding-left:14px}
.row:hover svg,.row.on svg{opacity:1;transform:none}
.row.on .rn{color:var(--green)}
.preview{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:#FFFFFF;border:1px solid var(--line)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px;opacity:0;transform:scale(1.03);transition:opacity .45s ease,transform .8s var(--ease-out)}
.preview img.on{opacity:1;transform:none}

/* ---------- Product ---------- */
.product{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,4.5vw,80px);align-items:center}
.gallery{display:grid;grid-template-rows:1fr auto;gap:12px;height:min(72vh,720px)}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#FFFFFF;border:1px solid var(--line);cursor:zoom-in}
.stage img{width:100%;height:100%;object-fit:contain;padding:14px;transition:opacity .3s ease}
.stage .zoom{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;transition:transform .15s ease}
.stage:hover .zoom{transform:scale(1.06)}
.stage .zoom svg{width:18px;height:18px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{width:76px;height:76px;border-radius:4px;overflow:hidden;background:#FFFFFF;border:1px solid var(--line);opacity:.55;outline:2px solid transparent;outline-offset:2px;transition:opacity .2s,outline-color .2s}
.thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.thumb:hover{opacity:.85}
.thumb[aria-current="true"]{opacity:1;outline-color:var(--brass)}
.p-kind{font-size:14px;color:var(--muted);margin-bottom:14px}
.product h2{max-width:14ch}
.product .lead{margin-top:18px}
.specs{margin-top:30px;border-top:1px solid var(--line)}
.spec{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec dt{color:var(--muted)}
.config{margin-top:26px;display:grid;grid-template-columns:1fr 92px;gap:20px;align-items:start}
.config-label{font-size:14px;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
.chip:hover{border-color:var(--ink)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.field{height:42px;border-radius:21px;border:1px solid var(--line);background:#fff;padding:0 16px;width:100%;max-width:320px}
.mini{width:92px;height:92px}
.mini .ref{fill:none;stroke:var(--muted);stroke-dasharray:2 3;stroke-width:1}
.mini .shape{fill:var(--brass-soft);stroke:var(--brass);stroke-width:1.5;transition:all .35s var(--ease-out)}
.mini text{font-size:10px;fill:var(--muted);font-family:var(--body)}
.add-row{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hint{font-size:14px;color:#8a5a1c;min-height:21px}

/* ---------- Estudio: diseña tu tablero ---------- */
.studio{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(18px,2.6vw,34px) clamp(26px,4.5vw,72px);align-items:start}
.studio-side{display:flex;flex-direction:column;justify-content:center}
.studio-main{display:flex;flex-direction:column;align-items:center;gap:10px}
.studio-controls{margin-top:clamp(16px,2vw,26px)}
.studio .lead{margin-top:14px;font-size:clamp(15px,1.15vw,17px)}
.studio h2{max-width:14ch}
.ctrl{margin-top:20px}
.ctrl-primero{margin-top:0}
.ctrl + .ctrl{margin-top:16px}
.ctrl-par{display:grid;grid-template-columns:auto 1fr;gap:16px 28px;align-items:start}
.chip[disabled]{opacity:.38;cursor:not-allowed}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.swatch{width:36px;height:36px;border-radius:50%;padding:3px;border:1px solid var(--line);background:#fff;transition:border-color .2s var(--ease-out),transform .2s var(--ease-out)}
.swatch span{display:block;width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center}
.swatch:hover{border-color:var(--ink)}
.swatch[aria-pressed="true"]{border-color:var(--brass-deep);transform:scale(1.08)}
.finish-name{margin-top:10px}

.studio-stage{display:grid;gap:10px;justify-items:center}
.mockup{width:100%;max-width:min(420px,42vh);aspect-ratio:1;touch-action:none;cursor:grab;border-radius:10px}
.mockup.dragging{cursor:grabbing}
.stage-note{font-size:13px;line-height:1.45;color:var(--muted);text-align:center;max-width:46ch;min-height:2.2em}
.logo-tools{width:100%;max-width:min(460px,48vh);display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.logo-row{display:flex;flex-wrap:wrap;gap:8px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.slider{display:grid;gap:4px}
.slider .config-label{margin:0}
.slider input[type=range]{width:100%;accent-color:var(--brass-deep);background:transparent}
.slider input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.file-field{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.btn-mini{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background-color .2s,border-color .2s}
.btn-mini:hover{background:rgba(22,32,29,.05);border-color:var(--ink)}
.btn-mini svg{width:16px;height:16px}
.file-field:focus-visible + .btn-mini{outline:2px solid var(--brass);outline-offset:3px}
.studio-err{color:#8C2F23;font-size:13px}

/* ---------- Process ---------- */
.process h2{max-width:18ch}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;counter-reset:s}
.steps li{padding:26px 28px 8px 0;border-top:2px solid var(--ink);position:relative;counter-increment:s}
.steps li + li{padding-left:28px;border-left:1px solid var(--line)}
.steps li::before{content:counter(s);font-family:var(--display);font-size:56px;font-weight:500;color:var(--brass);line-height:1;display:block;margin-bottom:20px;font-variant-numeric:tabular-nums}
.steps h3{font-size:22px;letter-spacing:-.015em;margin-bottom:10px}
.steps p{font-size:15px;color:var(--muted);max-width:30ch}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:48px}
.strip button{aspect-ratio:1;border-radius:50%;overflow:hidden;transition:transform .3s var(--ease-out)}
.strip button:hover{transform:rotate(-6deg) scale(1.03)}
.strip img{width:100%;height:100%;object-fit:cover}

/* ---------- Quote ---------- */
.quote{display:grid;grid-template-columns:1fr;max-width:760px;margin-inline:auto;gap:clamp(28px,5vw,88px);align-items:start}
.quote h2{margin-bottom:14px}
.cart{margin-top:30px;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item img{width:56px;height:56px;border-radius:6px;background:#FFFFFF;border:1px solid var(--line);object-fit:contain;padding:3px}
.item .iname{font-weight:600}
.item .isize{font-size:14px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:19px;height:38px}
.qty button{width:34px;height:36px;font-size:18px}
.qty input{width:48px;text-align:center;background:transparent;border:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.remove{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.remove:hover{background:rgba(22,32,29,.06);color:var(--ink)}
.remove svg{width:16px;height:16px}
.empty{padding:28px 0;color:var(--muted)}
.empty .btn{margin-top:16px}
.form{margin-top:28px;display:grid;gap:12px}
.form label{font-size:14px;color:var(--muted)}
.form input,.form textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
.form textarea{min-height:92px;resize:vertical}
.form input::placeholder,.form textarea::placeholder{color:#9AA3A0}
.q-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.contact-card{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:clamp(24px,3vw,40px) clamp(24px,3vw,40px) 150px;position:relative;overflow:hidden}
.contact-card h3{font-size:clamp(26px,2.4vw,34px);margin-bottom:12px}
.contact-card p{color:var(--muted)}
.contact-list{list-style:none;margin-top:24px;border-top:1px solid var(--line)}
.contact-list li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:100px 1fr;gap:12px;font-size:15px}
.contact-list span:first-child{color:var(--muted)}
.contact-card .seal{position:absolute;right:-50px;bottom:-90px;width:210px;height:210px;opacity:.9}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none}
.overlay.open{display:block}
.lightbox{background:rgba(12,18,16,.94)}
.lightbox.open .lb-img{animation:lbIn .3s var(--ease-out)}
@keyframes lbIn{from{opacity:0;transform:scale(.97)}}
.lb-img{position:absolute;inset:70px 90px;display:grid;place-items:center}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;color:#fff;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.lb-btn:hover{background:rgba(255,255,255,.18)}
.lb-btn svg{width:20px;height:20px}
.lb-close{top:16px;right:16px}
.lb-prev{left:20px;top:50%;transform:translateY(-50%)}
.lb-next{right:20px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:14px}
.menu{background:rgba(22,32,29,.45)}
.menu-panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);padding:84px 32px 32px;overflow-y:auto;box-shadow:-30px 0 60px -30px rgba(0,0,0,.35)}
.menu.open .menu-panel{animation:panelIn .38s cubic-bezier(.32,.72,0,1)}
@keyframes panelIn{from{transform:translateX(100%)}}
.menu-panel .lb-close{color:var(--ink);background:rgba(22,32,29,.06)}
.menu-panel ol{list-style:none;counter-reset:m}

/* ---------- Estudio ---------- */
function studioLine(){ return LINES.find(l => l.id === studio.mat) || LINES[0]; }

function studioShapes(line){
  if(line.allSizes || !line.sizes.length) return { round:true, square:true };
  return {
    round:  line.sizes.some(c => c.startsWith("R")),
    square: line.sizes.some(c => !c.startsWith("R"))
  };
}

function studioSizes(line){
  if(line.allSizes || !line.sizes.length) return [60,70,77,80];
  const propias = line.sizes
    .filter(c => studio.shape === "round" ? c.startsWith("R") : !c.startsWith("R"))
    .map(c => parseInt(c.replace("R",""), 10));
  return [...new Set(propias)].sort((a,b) => a-b);
}

/* Al cambiar de material, la forma y la medida se ajustan a lo que ese material ofrece */
function studioAjusta(){
  const line = studioLine();
  const formas = studioShapes(line);
  if(!formas[studio.shape]) studio.shape = formas.round ? "round" : "square";
  const medidas = studioSizes(line);
  if(!medidas.includes(studio.size)){
    studio.size = medidas.reduce((a,b) => Math.abs(b-studio.size) < Math.abs(a-studio.size) ? b : a, medidas[0]);
  }
}

const texturas = {};
function textura(clave){
  if(!texturas[clave]){
    const img = new Image();
    img.onload = () => dibujaMesa();
    img.src = IMG[clave];
    texturas[clave] = img;
  }
  return texturas[clave];
}

/* Silueta del tablero, redonda o cuadrada de esquinas suaves */
function siluetaMesa(ctx, redonda, x, y, d){
  ctx.beginPath();
  if(redonda){ ctx.arc(x + d/2, y + d/2, d/2, 0, Math.PI*2); return; }
  const r = d*0.02;
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+d, y,   x+d, y+d, r);
  ctx.arcTo(x+d, y+d, x,   y+d, r);
  ctx.arcTo(x,   y+d, x,   y,   r);
  ctx.arcTo(x,   y,   x+d, y,   r);
  ctx.closePath();
}

function dibujaMesa(){
  const c = document.getElementById("mockup");
  if(!c) return;
  const ctx = c.getContext("2d");
  const S = c.width, d = S*0.78, x = (S-d)/2, y = (S-d)/2;
  const redonda = studio.shape === "round";
  const fin = FINISHES.find(f => f.id === studio.finish) || FINISHES[0];
  const canto = EDGES[studio.mat] || EDGES.hpl;

  ctx.clearRect(0, 0, S, S);

  // Base con su sombra sobre el suelo
  ctx.save();
  ctx.shadowColor = "rgba(20,32,28,.24)";
  ctx.shadowBlur = S*0.05;
  ctx.shadowOffsetY = S*0.022;
  siluetaMesa(ctx, redonda, x, y, d);
  ctx.fillStyle = fin.color;
  ctx.fill();
  ctx.restore();

  // Acabado fotográfico, si el acabado lo tiene
  if(fin.img){
    const tex = textura(fin.img);
    if(tex.complete && tex.naturalWidth){
      ctx.save();
      siluetaMesa(ctx, redonda, x, y, d);
      ctx.clip();
      const k = Math.max(d/tex.naturalWidth, d/tex.naturalHeight)*(fin.zoom || 1.1);
      const w = tex.naturalWidth*k, h = tex.naturalHeight*k;
      ctx.drawImage(tex, S/2 - w/2, S/2 - h/2, w, h);
      ctx.restore();
    }
  }

  // El logo del cliente, recortado dentro del tablero
  if(studio.logo && studio.logo.naturalWidth){
    ctx.save();
    siluetaMesa(ctx, redonda, x, y, d);
    ctx.clip();
    const lado = d*studio.ls;
    const k = lado / Math.max(studio.logo.naturalWidth, studio.logo.naturalHeight);
    const lw = studio.logo.naturalWidth*k, lh = studio.logo.naturalHeight*k;
    ctx.translate(x + d*studio.lx, y + d*studio.ly);
    ctx.rotate(studio.rot*Math.PI/180);
    ctx.drawImage(studio.logo, -lw/2, -lh/2, lw, lh);
    ctx.restore();
  }

  // Luz de estudio: la superficie no es plana
  ctx.save();
  siluetaMesa(ctx, redonda, x, y, d);
  ctx.clip();
  const luz = ctx.createLinearGradient(x, y, x+d, y+d);
  luz.addColorStop(0,   "rgba(255,255,255,.18)");
  luz.addColorStop(.42, "rgba(255,255,255,.03)");
  luz.addColorStop(1,   "rgba(0,0,0,.10)");
  ctx.fillStyle = luz;
  ctx.fillRect(x, y, d, d);
  ctx.restore();

  // Canto o aro perimetral, según el material
  ctx.save();
  siluetaMesa(ctx, redonda, x, y, d);
  if(canto.kind === "oro"){
    ctx.lineWidth = S*0.020;
    const oro = ctx.createLinearGradient(x, y, x+d, y+d);
    oro.addColorStop(0,   "#F2DBA2");
    oro.addColorStop(.32, "#B8914B");
    oro.addColorStop(.62, "#8F6B2E");
    oro.addColorStop(1,   "#E8CE8E");
    ctx.strokeStyle = oro;
  } else if(canto.kind === "negro"){
    ctx.lineWidth = S*0.013;
    ctx.strokeStyle = "#15181A";
  } else {
    ctx.lineWidth = S*0.016;
    ctx.strokeStyle = "rgba(0,0,0,.28)";
  }
  ctx.stroke();
  ctx.restore();
}

/* Vuelve a pintar controles y mesa sin rehacer toda la presentación */
function refrescaEstudio(soloMesa){
  if(!soloMesa){
    const ctrl = document.getElementById("studioControls");
    const tools = document.getElementById("studioTools");
    const nota = document.querySelector(".stage-note");
    if(ctrl) ctrl.innerHTML = studioControles();
    if(tools) tools.innerHTML = studioHerramientas();
    if(nota) nota.textContent = studio.logo ? t("dragHint") : t("logoHint");
  }
  dibujaMesa();
}

function cargaLogo(file){
  if(!file) return;
  studio.err = "";
  if(file.size > 8*1024*1024){ studio.err = t("logoBig"); refrescaEstudio(); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    studio.logo = img;
    studio.lx = .5; studio.ly = .5; studio.rot = 0; studio.ls = .46;
    refrescaEstudio();
  };
  img.onerror = () => { URL.revokeObjectURL(url); studio.err = t("logoErr"); refrescaEstudio(); };
  img.src = url;
}

function descargaMesa(){
  const c = document.getElementById("mockup");
  if(!c) return;
  /* Abierta como archivo local, el navegador bloquea la exportación del lienzo */
  try{ c.getContext("2d").getImageData(0,0,1,1); }
  catch(_){ studio.err = t("downErr"); refrescaEstudio(); return; }
  c.toBlob(blob => {
    if(!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `koraconcept-${studio.mat}-${studio.size}cm.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, "image/png");
}

/* Arrastrar el logo sobre la mesa */
let arrastre = false;
function posEnMesa(e, c){
  const r = c.getBoundingClientRect();
  const d = r.width*0.78, x0 = (r.width-d)/2, y0 = (r.height-d)/2;
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left - x0)/d)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top  - y0)/d))
  };
}
document.addEventListener("pointerdown", e => {
  const c = e.target.closest("#mockup");
  if(!c || !studio.logo) return;
  arrastre = true;
  c.classList.add("dragging");
  c.setPointerCapture?.(e.pointerId);
  const q = posEnMesa(e, c); studio.lx = q.x; studio.ly = q.y;
  dibujaMesa();
});
document.addEventListener("pointermove", e => {
  if(!arrastre) return;
  const c = document.getElementById("mockup");
  if(!c) return;
  const q = posEnMesa(e, c); studio.lx = q.x; studio.ly = q.y;
  dibujaMesa();
});
document.addEventListener("pointerup", () => {
  arrastre = false;
  document.getElementById("mockup")?.classList.remove("dragging");
});

function slideProcess(){
  const strip = ["1664-redondo","taller-havana","cocacola","bistro-madera","mosaico"].map((n,k)=>{
    const lineIdx = LINES.findIndex(l=>l.img.includes(n));
    return `<button data-go="${PRODUCT_START+lineIdx}" aria-label="${L(LINES[lineIdx].name)}"><img src="${IMG[n]}" alt=""></button>`;
  }).join("");
  return `<section class="slide"><div class="inner process">
    <h2 class="h-l">${t("processTitle")}</h2>
    <ol class="steps">
      <li><h3>${t("s1t")}</h3><p>${t("s1d")}</p></li>
      <li><h3>${t("s2t")}</h3><p>${t("s2d")}</p></li>
      <li><h3>${t("s3t")}</h3><p>${t("s3d")}</p></li>
      <li><h3>${t("s4t")}</h3><p>${t("s4d")}</p></li>
    </ol>
    <div class="strip">${strip}</div>
  </div></section>`;
}

function cartHTML(){
  if(!state.cart.length){
    return `<div class="empty">${t("emptyCart")}<br><button class="btn btn-line" data-go="2">${t("goCollection")}</button></div>`;
  }
  return state.cart.map((it,idx)=>{
    const line = LINES.find(l=>l.id===it.id);
    return `<div class="item">
      <img src="${IMG[line.img[0]]}" alt="">
      <div><div class="iname">${L(line.name)}</div><div class="isize">${esc(it.label)}</div></div>
      <div class="qty" aria-label="${t("units")}">
        <button data-qty="${idx}" data-d="-1" aria-label="−">−</button>
        <input type="number" min="1" value="${it.qty}" data-qtyin="${idx}" aria-label="${t("units")}">
        <button data-qty="${idx}" data-d="1" aria-label="+">+</button>
      </div>
      <button class="remove" data-rm="${idx}" aria-label="${t("remove")}">${icon.x}</button>
    </div>`;
  }).join("");
}

function slideQuote(){
  return `<section class="slide"><div class="inner"><div class="quote">
    <div>
      <h2 class="h-l">${t("quoteTitle")}</h2>
      <p class="lead">${t("quoteLead")}</p>
      <div class="cart" id="cart">${cartHTML()}</div>
      <div class="form">
        <label for="qName">${t("nameLbl")}</label>
        <input id="qName" placeholder="${t("namePh")}" value="${esc(state.name)}">
        <label for="qNotes">${t("notesLbl")}</label>
        <textarea id="qNotes" placeholder="${t("notesPh")}">${esc(state.notes)}</textarea>
        <div class="q-actions">
          <button class="btn btn-brass" id="sendBtn">${t("send")}</button>
          <button class="btn btn-line" id="copyBtn">${t("copy")}</button>
        </div>
      </div>
    </div>
  </div></div></section>`;
}

const deck = document.getElementById("deck");
function renderAll(){
  deck.innerHTML = slideCover() + slideIntro() + slideIndex() +
    LINES.map(slideProduct).join("") + slideStudio() + slideProcess() + slideQuote();
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-ta]").forEach(el=>el.setAttribute("aria-label", t(el.dataset.ta)));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.documentElement.lang = lang;
  document.title = lang==="es" ? "Koraconcept, colección de tableros" : "Koraconcept, table top collection";
  renderMenu();
  dibujaMesa();
  go(current, true);
}
const slides = () => [...deck.children];

/* ---------- Navegación ---------- */
function go(n, instant){
  const all = slides();
  n = Math.max(0, Math.min(all.length-1, n));
  all.forEach((s,i)=>{
    if(instant) s.style.transition = "none";
    s.classList.toggle("active", i===n);
    s.classList.toggle("before", i<n);
    s.setAttribute("aria-hidden", i!==n);
    if(i===n) s.removeAttribute("inert"); else s.setAttribute("inert","");
  });
  if(instant) requestAnimationFrame(()=>all.forEach(s=>s.style.transition=""));
  current = n;
  document.body.classList.toggle("on-dark", !!all[n].dataset.dark);
  document.body.classList.toggle("alu-bg", all[n].classList.contains("alu"));
  document.getElementById("counter").textContent = `${n+1} / ${all.length}`;
  document.getElementById("progress").style.transform = "scaleX(" + ((n+1)/all.length) + ")";
  document.getElementById("prev").disabled = n===0;
  document.getElementById("next").disabled = n===all.length-1;
  all[n].scrollTop = 0;
  history.replaceState(null,"",location.pathname + location.search + "#"+(n+1));
  document.querySelectorAll("#menuList button").forEach((b,i)=>b.setAttribute("aria-current", i===n));
}
document.getElementById("prev").onclick = ()=>go(current-1);
document.getElementById("next").onclick = ()=>go(current+1);

function renderMenu(){
  document.getElementById("menuList").innerHTML = T[lang].slides.map((s,i)=>
    `<li><button data-menugo="${i}" aria-current="${i===current}">${s}</button></li>`).join("");
}

/* ---------- Idioma ---------- */
function setLang(next){
  if(next!=="es" && next!=="en") return;
  try{ localStorage.setItem(LANG_KEY, next); }catch(_){}
  const u = new URL(location.href); u.searchParams.set("lang", next);
  history.replaceState(null, "", u.pathname + u.search + u.hash);
  if(next===lang) return;
  lang = next; renderAll();
}

/* ---------- Interacciones ---------- */
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2000);
}
function updateBadge(){
  const b = document.getElementById("badge");
  b.textContent = state.cart.reduce((a,c)=>a+c.qty,0);
  b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
}
function refreshCart(){ const c = document.getElementById("cart"); if(c) c.innerHTML = cartHTML(); updateBadge(); }

document.addEventListener("click", e=>{
  const el = e.target.closest("button, a");
  if(!el) return;
  const d = el.dataset;

  if(d.go !== undefined){ e.preventDefault(); closeOverlays(); go(+d.go); return; }
  if(d.menugo !== undefined){ closeOverlays(); go(+d.menugo); return; }
  if(d.lang){ setLang(d.lang); return; }
  if(d.close !== undefined){ closeOverlays(); return; }

  if(d.thumb){
    const line = LINES.find(l=>l.id===d.thumb);
    const img = document.querySelector(`[data-stage="${d.thumb}"]`);
    img.src = IMG[line.img[+d.k]];
    img.closest(".stage").dataset.k = d.k;
    el.parentElement.querySelectorAll(".thumb").forEach(b=>b.setAttribute("aria-current", b===el));
    return;
  }
  if(d.open){ openLightbox(d.open, +d.k); return; }

  if(d.size){
    const ch = state.choice[d.size] ||= {};
    ch.size = d.v;
    el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", b===el));
    const mini = el.closest(".config").querySelector(".mini");
    if(mini) mini.outerHTML = miniSVG(d.v);
    document.querySelector(`[data-hint="${d.size}"]`).textContent = "";
    return;
  }
  if(d.thick){
    const ch = state.choice[d.thick] ||= {};
    ch.thick = d.v;
    el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", b===el));
    document.querySelector(`[data-hint="${d.thick}"]`).textContent = "";
    return;
  }
  if(d.add){
    const line = LINES.find(l=>l.id===d.add);
    const ch = state.choice[line.id] || {};
    const hint = document.querySelector(`[data-hint="${line.id}"]`);
    if(line.sizes.length && !ch.size){ hint.textContent = t("needSize"); return; }
    if(line.thickness && !ch.thick){ hint.textContent = t("needThick"); return; }
    const parts = [];
    if(ch.size) parts.push(fmtSize(ch.size) + " cm");
    if(ch.thick) parts.push(ch.thick);
    if(ch.free) parts.push(ch.free);
    const label = parts.join(", ") || t("sizesTbd");
    const found = state.cart.find(c=>c.id===line.id && c.label===label);
    if(found) found.qty++; else state.cart.push({id:line.id, label, qty:1});
    refreshCart(); toast(t("added"));
    return;
  }

  if(d.smat){ studio.mat = d.smat; studioAjusta(); refrescaEstudio(); return; }
  if(d.sshape){ studio.shape = d.sshape; studioAjusta(); refrescaEstudio(); return; }
  if(d.ssize){ studio.size = +d.ssize; refrescaEstudio(); return; }
  if(d.sfin){ studio.finish = d.sfin; refrescaEstudio(); return; }
  if(d.sact === "center"){ studio.lx = .5; studio.ly = .5; dibujaMesa(); return; }
  if(d.sact === "quitar"){ studio.logo = null; studio.err = ""; refrescaEstudio(); return; }
  if(d.sact === "descargar"){ descargaMesa(); return; }
  if(d.sact === "anadir"){
    const line = studioLine();
    const label = studioEtiqueta();
    const igual = state.cart.find(c => c.id === line.id && c.label === label);
    if(igual) igual.qty++; else state.cart.push({ id:line.id, label, qty:1 });
    refreshCart(); toast(t("added"));
    return;
  }

  if(d.qty !== undefined){ const it = state.cart[+d.qty]; it.qty = Math.max(1, it.qty + (+d.d)); refreshCart(); return; }
  if(d.rm !== undefined){ state.cart.splice(+d.rm,1); refreshCart(); return; }

  if(el.id==="sendBtn"){ window.location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent(t("mailSubject"))}&body=${encodeURIComponent(requestText())}`; return; }
  if(el.id==="copyBtn"){
    const txt = requestText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(t("copied"))).catch(()=>{
      const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast(t("copied")); }catch(_){} ta.remove();
    });
    return;
  }
  if(el.id==="cartBtn"){ closeOverlays(); go(slides().length-1); return; }
  if(el.id==="menuBtn"){ openOverlay("menu"); return; }
  if(el.id==="fsBtn"){ toggleFs(); return; }
  if(el.id==="lbPrev"){ stepLightbox(-1); return; }
  if(el.id==="lbNext"){ stepLightbox(1); return; }
});



document.addEventListener("change", e=>{
  if(e.target.id === "logoFile"){ cargaLogo(e.target.files && e.target.files[0]); }
});

document.addEventListener("input", e=>{
  const d = e.target.dataset;
  if(d.sls !== undefined){ studio.ls = (+e.target.value)/100; dibujaMesa(); return; }
  if(d.srot !== undefined){ studio.rot = +e.target.value; dibujaMesa(); return; }
  if(d.free){ (state.choice[d.free] ||= {}).free = e.target.value.trim(); }
  if(d.qtyin !== undefined){ const v = parseInt(e.target.value,10); if(v>0){ state.cart[+d.qtyin].qty = v; updateBadge(); } }
  if(e.target.id==="qName") state.name = e.target.value;
  if(e.target.id==="qNotes") state.notes = e.target.value;
});

/* Vista previa en el índice */
document.addEventListener("pointerover", e=>{
  const r = e.target.closest("[data-prev]"); if(r) setPreview(+r.dataset.prev);
});
document.addEventListener("focusin", e=>{
  const r = e.target.closest("[data-prev]"); if(r) setPreview(+r.dataset.prev);
});
function setPreview(i){
  document.querySelectorAll("[data-prev]").forEach(b=>b.classList.toggle("on", +b.dataset.prev===i));
  document.querySelectorAll("[data-pimg]").forEach(img=>img.classList.toggle("on", +img.dataset.pimg===i));
}

function requestText(){
  const lines = state.cart.map(c=>`- ${L(LINES.find(l=>l.id===c.id).name)} (${c.label}) x ${c.qty}`);
  return [t("mailIntro"), "", ...(lines.length?lines:["-"]), "", state.name ? `${t("nameLbl")}: ${state.name}` : "", state.notes ? `${t("notesLbl")}: ${state.notes}` : ""].filter((x,i,a)=>x!=="" || a[i-1]!=="").join("\n");
}

/* ---------- Lightbox ---------- */
let lb = {id:null,k:0};
function openOverlay(id){ document.getElementById(id).classList.add("open"); document.getElementById(id).querySelector("[data-close]").focus(); }
function closeOverlays(){ document.querySelectorAll(".overlay.open").forEach(o=>o.classList.remove("open")); }
function openLightbox(id,k){ lb = {id,k}; drawLightbox(); openOverlay("lightbox"); }
function drawLightbox(){
  const line = LINES.find(l=>l.id===lb.id);
  const img = document.getElementById("lbImg");
  img.src = IMG[line.img[lb.k]]; img.alt = L(line.name);
  document.getElementById("lbCount").textContent = `${L(line.name)}  ${lb.k+1} / ${line.img.length}`;
  const multi = line.img.length>1;
  document.getElementById("lbPrev").style.display = multi ? "" : "none";
  document.getElementById("lbNext").style.display = multi ? "" : "none";
}
function stepLightbox(dir){
  const n = LINES.find(l=>l.id===lb.id).img.length;
  lb.k = (lb.k + dir + n) % n; drawLightbox();
}
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click", e=>{ if(e.target===o || e.target.classList.contains("lb-img")) closeOverlays(); }));

/* ---------- Teclado, gestos, pantalla completa ---------- */
function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea")) return;
  const lbOpen = document.getElementById("lightbox").classList.contains("open");
  const anyOpen = document.querySelector(".overlay.open");
  if(e.key==="Escape"){ closeOverlays(); return; }
  if(lbOpen){ if(e.key==="ArrowRight") stepLightbox(1); if(e.key==="ArrowLeft") stepLightbox(-1); return; }
  if(anyOpen) return;
  if(["ArrowRight","PageDown"].includes(e.key) || (e.key===" " && !e.target.closest("button"))){ e.preventDefault(); go(current+1); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(current-1); }
  else if(e.key==="Home") go(0);
  else if(e.key==="End") go(slides().length-1);
  else if(e.key.toLowerCase()==="f") toggleFs();
});
let tx=0, ty=0;
deck.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
deck.addEventListener("touchend", e=>{
  if(e.target.closest("input, textarea, #mockup, .logo-tools")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) go(current + (dx<0 ? 1 : -1));
}, {passive:true});

/* ---------- Inicio ---------- */
const startHash = parseInt(location.hash.slice(1),10);
if(startHash>0) current = startHash-1;
renderAll();
</script>
